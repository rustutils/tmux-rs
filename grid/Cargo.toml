[package]
name         = "tmux-grid"
version.workspace    = true
edition      = "2024"
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
description  = "Grid/screen backing store for tmux-rs: cells, lines, scrollback, reader."

[dependencies]
bitflags   = { version = "2.9.1" }
libc       = { version = "0.2.174" }
log        = { version = "0.4" }
tmux-types = { path = "../types" }
tmux-utf8  = { path = "../utf8" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
missing_safety_doc = "allow" # most unsafe fns go away in Track 2, new ones need a Safety section
