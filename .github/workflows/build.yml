# Lints and tests for every push to main or tmux-3.8 and every pull request.
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: build

on:
  push:
    branches: [main, tmux-3.8]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests start servers that read the locale. Without UTF-8 the
  # UTF-8 tests see a different tmux.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # rustfmt (nightly, for the unstable options), rustdoc and clippy, the
  # same as `just check`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Installed last, so stable is the default toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  # Unit and integration tests of every crate, with the Rust binaries on
  # both sides.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      # tmux-rs reads terminfo files itself and links no curses library,
      # but the tests need the terminfo entries.
      - name: Install terminfo entries
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-term
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --profile ci
      - &no-panics
        name: Fail on server panics
        if: ${{ !cancelled() }}
        run: |
          if ls server-panic-*.txt 2>/dev/null; then
            head -20 server-panic-*.txt
            exit 1
          fi
      - &upload-results
        name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ matrix.os || 'linux' }}
          path: |
            target/nextest/ci/junit.xml
            server-panic-*.txt
          if-no-files-found: ignore

  # The integration tests against C tmux 3.8 in the three mixed
  # combinations, which is what checks protocol compatibility. Ubuntu
  # ships an older tmux, so 3.8 is built from source and cached.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-term libncurses-dev libevent-dev \
            bison autoconf automake pkg-config
      - uses: actions/cache@v4
        id: tmux-cache
        with:
          path: ~/tmux-3.8
          key: tmux-3.8-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build tmux 3.8
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.8 https://github.com/tmux/tmux.git /tmp/tmux-src
          cd /tmp/tmux-src
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-3.8"
          make -j"$(nproc)"
          make install
      - name: Check tmux 3.8
        run: |
          echo "TMUX_38=$HOME/tmux-3.8/bin/tmux" >> "$GITHUB_ENV"
          "$HOME/tmux-3.8/bin/tmux" -V | grep -qx 'tmux 3.8'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: C server, C client
        env:
          TMUX_SERVER_BIN: ${{ env.TMUX_38 }}
          TMUX_CLIENT_BIN: ${{ env.TMUX_38 }}
          TMUX_REFERENCE_BIN: ${{ env.TMUX_38 }}
        run: cargo nextest run --tests --profile ci
      - name: Rust server, C client
        if: ${{ !cancelled() }}
        env:
          TMUX_CLIENT_BIN: ${{ env.TMUX_38 }}
          TMUX_REFERENCE_BIN: ${{ env.TMUX_38 }}
        run: cargo nextest run --tests --profile ci
      - name: C server, Rust client
        if: ${{ !cancelled() }}
        env:
          TMUX_SERVER_BIN: ${{ env.TMUX_38 }}
          TMUX_REFERENCE_BIN: ${{ env.TMUX_38 }}
        run: cargo nextest run --tests --profile ci
      - *no-panics
      - *upload-results

  # The test suite under AddressSanitizer, which catches use after free
  # and out of bounds access in the remaining unsafe code. Leaks are not
  # checked yet, the client and server do not free everything on exit.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v5
      - name: Install terminfo entries
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-term
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # An explicit target keeps the sanitizer out of build scripts and
      # proc macros.
      - run: cargo nextest run --workspace --profile ci --target x86_64-unknown-linux-gnu
      - *no-panics

  # macOS catches code that differs by platform (timeval field types,
  # getpeereid, osdep). Runners are slower to get, so one job does both
  # clippy and the tests.
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets -- -Dwarnings
      - run: cargo nextest run --workspace --profile ci
        if: ${{ !cancelled() }}
      - *no-panics
      - *upload-results
