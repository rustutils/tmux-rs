# Lints and tests for every push to main or tmux-3.8 and every pull request.
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
#
# The Linux jobs run in a Fedora container, the distribution tmux-rs is
# developed on. Fedora 45 packages tmux 3.8, the version the tests compare
# against. Containers run as root, but tmux is not normally run as root
# and the server access tests need a normal user, so the jobs install as
# root and then run cargo as the user "tester".
name: build

on:
  push:
    branches: [main, tmux-3.8]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests start servers that read the locale. Without UTF-8 the
  # UTF-8 tests see a different tmux.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # rustfmt (nightly, for the unstable options), rustdoc and clippy, the
  # same as `just check`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # --init reaps processes whose parent exited, such as the daemonized
    # tmux servers, so they do not stay around as zombies.
    container: &fedora-container
      image: fedora:45
      options: --init
    env: &fedora-env
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    defaults:
      run: &as-tester
        shell: runuser -u tester -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - &fedora-setup
        name: Install packages and add the test user
        shell: bash
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc git make tar gzip xz curl which procps-ng hostname \
            util-linux ncurses-term tmux
          useradd -m tester
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Installed last, so stable is the default toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - &hand-over
        name: Hand the workspace and toolchain to the test user
        shell: bash
        run: chown -R tester "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"
      - run: just check

  # Unit and integration tests of every crate, with the Rust binaries on
  # both sides. The parity tests compare with the packaged tmux 3.8.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: *fedora-container
    env: *fedora-env
    defaults:
      run: *as-tester
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - *fedora-setup
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - *hand-over
      - run: cargo nextest run --workspace --profile ci
      - &no-panics
        name: Fail on server panics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if ls server-panic-*.txt 2>/dev/null; then
            head -20 server-panic-*.txt
            exit 1
          fi
      - &upload-results
        name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ matrix.os || 'linux' }}
          path: |
            target/nextest/ci/junit.xml
            server-panic-*.txt
          if-no-files-found: ignore

  # The integration tests against C tmux 3.8 in the three mixed
  # combinations, which is what checks protocol compatibility. The same
  # as the last three steps of `just test`.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: *fedora-container
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      TMUX_REFERENCE_BIN: /usr/bin/tmux
    defaults:
      run: *as-tester
    steps:
      - *fedora-setup
      - name: Check the packaged tmux is 3.8
        shell: bash
        run: /usr/bin/tmux -V | grep -qx 'tmux 3.8'
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - *hand-over
      - name: C server, C client
        env:
          TMUX_SERVER_BIN: /usr/bin/tmux
          TMUX_CLIENT_BIN: /usr/bin/tmux
        run: cargo nextest run --tests --profile ci
      - name: Rust server, C client
        if: ${{ !cancelled() }}
        env:
          TMUX_CLIENT_BIN: /usr/bin/tmux
        run: cargo nextest run --tests --profile ci
      - name: C server, Rust client
        if: ${{ !cancelled() }}
        env:
          TMUX_SERVER_BIN: /usr/bin/tmux
        run: cargo nextest run --tests --profile ci
      - *no-panics
      - *upload-results

  # The test suite under AddressSanitizer, which catches use after free
  # and out of bounds access in the remaining unsafe code. Leaks are not
  # checked yet, the client and server do not free everything on exit.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: *fedora-container
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      ASAN_OPTIONS: detect_leaks=0
      RUSTFLAGS: -Zsanitizer=address
    defaults:
      run: *as-tester
    steps:
      - *fedora-setup
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - *hand-over
      # An explicit target keeps the sanitizer out of build scripts and
      # proc macros.
      - run: cargo nextest run --workspace --profile ci --target x86_64-unknown-linux-gnu
      - *no-panics

  # macOS catches code that differs by platform (c_char, timeval field
  # types, getpeereid, osdep). Runners are slower to get, so one job does
  # both clippy and the tests.
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets -- -Dwarnings
      - run: cargo nextest run --workspace --profile ci
        if: ${{ !cancelled() }}
      - name: Fail on server panics
        if: ${{ !cancelled() }}
        run: |
          if ls server-panic-*.txt 2>/dev/null; then
            head -20 server-panic-*.txt
            exit 1
          fi
      - *upload-results
