---
# Coverage of the unit and integration tests and the upstream regress
# scripts, uploaded to Codecov. Runs in a Fedora container as the user
# "tester", like the build workflow (see there for why).
name: Coverage

on:
  push:
    branches: [main, tmux-3.8]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: fedora:45
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    defaults:
      run:
        shell: runuser -u tester -- bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Install packages and add the test user
        shell: bash
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc git make tar gzip xz curl which procps-ng hostname \
            util-linux ncurses-term tmux gnupg2
          useradd -m tester

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Hand the workspace and toolchain to the test user
        shell: bash
        run: |
          chown -R tester "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"
          # The Codecov uploader runs as root and reads the repository.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tests
        run: cargo llvm-cov --no-report nextest --workspace --profile ci

      # Most regress scripts do not pass yet and the Makefile ignores
      # their exit codes. They only add coverage, so a hanging script
      # must not hold up the job.
      - name: Regress scripts
        timeout-minutes: 15
        continue-on-error: true
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo build
          make -C regress

      - name: Report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
