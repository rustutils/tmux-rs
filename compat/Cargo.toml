[package]
name         = "tmux-compat"
version.workspace    = true
edition      = "2024"
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
description  = "BSD/libc compatibility helpers used by tmux-rs: b64, vis/unvis, strlcat/strlcpy, reallocarray, etc."

[dependencies]
bitflags = { version = "2.9.1" }
libc     = { version = "0.2.174" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
missing_safety_doc = "allow" # most unsafe fns go away in Track 2, new ones need a Safety section
