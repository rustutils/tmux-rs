[package]
name        = "xtask"
version     = "0.0.1"
edition     = "2024"
license     = "ISC"
description = "Project tooling for tmux-rs, run with cargo xtask"
publish     = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn         = { version = "2", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"
